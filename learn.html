<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Got It! — Learn</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Plausible analytics — proxied first-party via Vercel. Site: you-got-it.vercel.app -->
  <script defer data-domain="you-got-it.vercel.app" data-api="/plausible/event" src="/js/script.js"></script>
  <script defer src="analytics.js"></script>
</head>
<body>

  <!-- top bar -->
  <header class="topbar">
    <a class="logo" href="dashboard.html" aria-label="You Got It! home (logo placeholder)">
      <span class="logo__mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5 L10 18 L20 6" fill="none" stroke="#EFE84B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="logo__word">You Got It!</span>
    </a>
    <nav class="topbar__nav">
      <a href="dashboard.html">Your desk</a>
      <a href="learn.html" class="active">Learn</a>
      <a href="aiground.html">AIGround</a>
      <a href="progress.html">Progress</a>
    </nav>
    <div class="topbar__user">
      <a class="nav-gamify" id="navGamify" href="progress.html" hidden title="Your progress">
        <span class="nav-gamify__char" id="navGamifyChar"></span>
        <span class="nav-gamify__txt">Level <b id="navGamifyLevel">1</b> · <b id="navGamifyPts">0</b> pts</span>
      </a>
      <button class="user-chip" id="userChip" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu">
        <span class="name">Welcome</span>
        <span class="avatar"></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="user-menu" id="userMenu" role="menu">
        <div class="user-menu__head">Signed in as <strong>you</strong></div>
        <a class="user-menu__item" href="index.html" id="signOutBtn" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 17l5-5-5-5M21 12H9M12 19H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Sign out
        </a>
      </div>
    </div>
    <button class="topbar__menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="mobileNav">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <nav class="mobile-nav" id="mobileNav" aria-label="Main">
    <a href="dashboard.html">Your desk</a>
    <a href="learn.html" class="active">Learn</a>
    <a href="aiground.html">AIGround</a>
    <a href="progress.html">Progress</a>
  </nav>

  <main class="page">
    <a class="back-link" href="dashboard.html">&larr; Your desk</a>

    <div class="page-head">
      <p class="eyebrow" id="learnEyebrow"></p>
      <h1 id="learnHeading"></h1>
      <p class="lead" id="learnLead"></p>
    </div>

    <div class="lessons" id="lessons"></div>

    <!-- CTA -->
    <div class="learn-cta">
      <div>
        <p class="learn-cta__title">Ready to try it for real?</p>
        <p class="learn-cta__text" id="learnCtaText"></p>
      </div>
      <a class="btn btn--primary" id="enterAiground" href="aiground.html?task=recall" data-event="Enter AIGround">Enter AIGround &rarr;</a>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="admin.js"></script>
  <script src="characters.js"></script>
  <script src="progress-cache.js"></script>
  <script src="gamify-nav.js"></script>
  <script src="feedback-widget.js"></script>
  <script>
    ygiRequireProfile();

    // ---------- task-aware lesson content ----------
    // Each task's three judgment lessons map to how it's graded in AIGround.
    const LEARN = {
      'reminder-sms': {
        title: 'Appointment reminders',
        eyebrow: 'Learn · Start here',
        heading: 'Appointment reminder text',
        lead: "Your first task — a gentle one. Three quick ideas, about two minutes, then you'll try it in AIGround.",
        ctaText: "In AIGround you'll write a short reminder text yourself and get friendly, graded feedback — on safe, synthetic details.",
        lessons: [
          {
            title: 'Tell the AI who you are',
            text: `A quick line of context is all it takes for the AI to sound like your clinic. Name the practice and the tone you want — friendly and clear — instead of leaving it to guess.`,
            do: `"A short, friendly SMS from Riverstone Family Practice reminding a patient about their appointment."`,
            dont: `"Write a reminder."`,
          },
          {
            title: 'Keep it short',
            text: `It's a text, not a letter. A reminder only needs the day, the time, and how to reschedule — a sentence or two. If the AI writes a paragraph, trim it back.`,
            do: `"Keep it to one or two short sentences."`,
            dont: `A long message with extra instructions no one asked for.`,
          },
          {
            title: 'Leave the medical reason out',
            text: `A text message isn't a secure, private channel — and a reminder doesn't need the reason for the visit. Give the time and place; leave the clinical detail (like why they're coming in) out of it.`,
            do: `"…your appointment this Thursday at 2pm."`,
            dont: `"…your diabetes review this Thursday at 2pm."`,
          },
        ],
      },
      'plain-english': {
        title: 'Plain English',
        eyebrow: 'Learn · Start here',
        heading: 'Say it in plain English',
        lead: "A starter task — three quick ideas, about two minutes, then you'll try it in AIGround.",
        ctaText: "In AIGround you'll rewrite a real clinical note yourself and get friendly, graded feedback — on safe, synthetic detail.",
        lessons: [
          {
            title: "Say who it's for",
            text: `The AI writes for whoever you tell it to. Say it's for a <em>patient</em> to read, in plain, everyday English — and the jargon falls away on its own.`,
            do: `"Rewrite this for a patient in plain, friendly English."`,
            dont: `"Rewrite this."`,
          },
          {
            title: 'Keep the meaning exact',
            text: `This is the whole job: the words change, the facts don't. Check the dose, the timing and the timeframe against the original — the AI will happily turn "twice a day" into "once a day" without blinking.`,
            do: `Confirm "500mg twice a day, with meals" and "in 3 months" survived intact.`,
            dont: `Let "BD" quietly become "once a day".`,
          },
          {
            title: "Don't add anything new",
            text: `A rewrite translates — it doesn't advise. If the AI adds "avoid sugar" or "exercise daily" that wasn't in the note, take it out; you're not the one prescribing.`,
            do: `Say only what the note said, in plainer words.`,
            dont: `Let it bolt on health tips no clinician wrote.`,
          },
        ],
      },
      'closure-notice': {
        title: 'Closure notices',
        eyebrow: 'Learn · Start here',
        heading: 'Public holiday closure notice',
        lead: "A starter task — three quick ideas, about two minutes, then you'll try it in AIGround.",
        ctaText: "In AIGround you'll write a real closure notice yourself and get friendly, graded feedback — on safe, synthetic detail.",
        lessons: [
          {
            title: 'Give the clinic and the dates',
            text: `A notice only works if it says who and when. Tell the AI the clinic name, the day you're closed, and when you reopen — that's the whole point of it.`,
            do: `"Riverstone Family Practice is closed Mon 9 June, reopening Tue 10 June 9am."`,
            dont: `"Write a closure notice."`,
          },
          {
            title: 'Keep it short',
            text: `A notice is scanned, not read. A few clear lines beat a formal paragraph — trim the "please be advised" padding.`,
            do: `Two or three short lines people can take in at a glance.`,
            dont: `A long, formal letter.`,
          },
          {
            title: "Don't invent a number",
            text: `The AI fills gaps — it'll happily make up an after-hours phone number. Point people to <strong>000</strong> in an emergency, or leave a placeholder you fill in yourself.`,
            do: `"In an emergency, call 000."`,
            dont: `Trust an invented line: "after-hours: (03) 9412 7788".`,
          },
        ],
      },
      recall: {
        title: 'Recall letters',
        eyebrow: 'Learn · Patient correspondence',
        heading: 'Recall & reminder letters',
        lead: "Four judgment skills, one real task — about five minutes, then you'll prove it in AIGround.",
        ctaText: "In AIGround you'll write the letter yourself and get graded on these four skills — on safe, synthetic data.",
        lessons: [
          {
            title: 'Give the AI context',
            text: `The AI can't sound like <em>your</em> clinic unless you tell it who you are, the tone you want, and how patients book. Vague in, generic out — so name the clinic, the feeling ("warm, plain-English"), and the call to action.`,
            do: `"Warm, plain-English recall letter for Riverstone Family Practice. Invite them to book online or by phone."`,
            dont: `"Write a recall letter."`,
          },
          {
            title: 'Keep unsafe data out',
            text: `Names, dates of birth, Medicare numbers and clinical results are sensitive health information. A general AI tool never needs them to draft a letter — and pasting them in can be an unauthorised disclosure. Describe the <em>situation</em>, not the person.`,
            do: `"a patient overdue for a routine review"`,
            dont: `"Margaret Nguyen, DOB 14/03/1958, Medicare 2953 8881 71, borderline high result"`,
          },
          {
            title: "Don't reveal the clinical result",
            text: `A reminder invites a booking — it should never state a clinical finding. The AI will happily repeat any result you feed it, so keep it out; that conversation belongs in the room, not the letterbox. Dr Okafor asked you not to alarm her.`,
            do: `"It's time for your regular review — please book in."`,
            dont: `"Your recent borderline high blood sugar result means you're due…"`,
          },
          {
            title: 'Verify what it gives back',
            text: `AI writes confidently even when it's wrong — it will invent a phone number or a date to fill a gap. Treat every draft as a first version: leave placeholders for anything you can't confirm, and check facts against the real source before it goes out.`,
            do: `Leave "[booking phone]" and confirm it before sending.`,
            dont: `Trust an invented number: "call us on (03) 9412 6680".`,
          },
        ],
      },
      complaint: {
        title: 'Complaint responses',
        eyebrow: 'Learn · Complaints & sensitive',
        heading: 'Complaint responses',
        lead: "Four judgment skills for a first reply that's warm, safe, and careful — then you'll prove it in AIGround.",
        ctaText: "In AIGround you'll write the reply yourself and get graded on these four skills — on a safe, synthetic complaint.",
        lessons: [
          {
            title: 'Set a calm, careful tone',
            text: `A complaint reply lives or dies on tone. Tell the AI who you are and the feeling you want — calm, warm, and genuinely sorry for the <em>experience</em> — so it de-escalates instead of sounding defensive or robotic.`,
            do: `"Calm, empathetic first reply from Riverstone Family Practice to an upset patient — acknowledge how she felt, no defensiveness."`,
            dont: `"Reply to this complaint."`,
          },
          {
            title: 'Keep her details out',
            text: `The complaint names a real person and touches her care. A general AI tool never needs her name or any health detail to draft a reply — describe the <em>situation</em>, not the patient, and add names yourself afterwards.`,
            do: `"a patient who waited a long time and felt dismissed by reception"`,
            dont: `"Dawn Whitaker — furious about waiting for her diabetes review…"`,
          },
          {
            title: "Apologise, don't over-commit",
            text: `You can be warm without signing the clinic up to things. Say sorry for the experience, but don't admit fault, promise it'll never happen again, or offer a refund — those aren't yours to give in a first reply. Some complaints need a real human: hand off to a call.`,
            do: `"I'm sorry about your experience — our practice principal will call you to talk it through."`,
            dont: `"This was completely our fault, it won't happen again, and here's a refund."`,
          },
          {
            title: "Don't let it invent facts",
            text: `The AI fills gaps with plausible fiction — it will invent a reason for the delay it was never told. Apologise for the experience without making up an excuse; only state what you actually know.`,
            do: `Apologise for the wait without explaining a cause you can't confirm.`,
            dont: `"The doctor was running late because of an emergency." (You were never told why.)`,
          },
        ],
      },
    };

    (function renderLearn() {
      const params = new URLSearchParams(location.search);
      const req = params.get('task');
      const taskId = LEARN[req] ? req : 'recall';
      const L = LEARN[taskId];
      document.title = 'You Got It! — Learn: ' + L.title;
      document.getElementById('learnEyebrow').textContent = L.eyebrow;
      document.getElementById('learnHeading').textContent = L.heading;
      document.getElementById('learnLead').textContent = L.lead;
      document.getElementById('learnCtaText').textContent = L.ctaText;
      document.getElementById('enterAiground').setAttribute('href', 'aiground.html?task=' + taskId);
      document.getElementById('lessons').innerHTML = L.lessons.map((l, i) => `
        <article class="lesson">
          <div class="lesson__num">${String(i + 1).padStart(2, '0')}</div>
          <div class="lesson__body">
            <h2 class="lesson__title">${l.title}</h2>
            <p class="lesson__text">${l.text}</p>
            <div class="dodont">
              <div class="dd dd--do">
                <div class="dd__label">✓ Do</div>
                <p class="dd__text">${l.do}</p>
              </div>
              <div class="dd dd--dont">
                <div class="dd__label">✕ Don't</div>
                <p class="dd__text">${l.dont}</p>
              </div>
            </div>
          </div>
        </article>`).join('');
    })();

    const menuBtn = document.getElementById('menuBtn');
    const mobileNav = document.getElementById('mobileNav');
    menuBtn.addEventListener('click', () => {
      const open = mobileNav.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', open);
    });

    // account menu (sign out)
    const userChip = document.getElementById('userChip');
    const userMenu = document.getElementById('userMenu');
    userChip.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = userMenu.classList.toggle('open');
      userChip.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', (e) => {
      if (!userMenu.contains(e.target) && !userChip.contains(e.target)) {
        userMenu.classList.remove('open');
        userChip.setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { userMenu.classList.remove('open'); userChip.setAttribute('aria-expanded', 'false'); }
    });
  </script>

</body>
</html>
